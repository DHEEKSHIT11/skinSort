# Train-then-serve, following the course Docker_Labs/Lab2 compose pattern:
# the trainer runs the model pipeline and exports the Production model to a shared
# folder; the serving service starts only after the trainer finished successfully.
#
#   docker compose -f docker/docker-compose.yml up --build      # run from the repository root
#   curl -F photo=@some_photo.jpg -F q_changed=yes http://localhost:8080/triage
#
# The repository is mounted at the SAME absolute path inside the trainer, because
# mlflow.db stores absolute artifact paths (mlruns/...). Needs the DVC data
# (Data-Pipeline/data/processed) and outputs/models/<backbone>/best.pt from the GPU run.

services:
  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: trainer
    image: skinsort-trainer
    shm_size: "2gb"                  # PyTorch DataLoader workers share batches through /dev/shm
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
    command: ["src.training.pipeline", "--fail-if-rejected"]

  # Image backbones on a GPU machine (NVIDIA Container Toolkit), same trainer image built with CUDA PyTorch:
  #   TORCH_INDEX=https://download.pytorch.org/whl/<cuda version> docker compose -f docker/docker-compose.yml --profile gpu run backbones
  backbones:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: trainer
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    image: skinsort-trainer-gpu
    shm_size: "2gb"
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
    command: ["src.training.train"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  serving:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: serving_base           # no baked-in model: it is mounted from the trainer's export
    image: skinsort-serving-base
    ports:
      - "8080:8080"
    environment:
      MODEL_DIR: /exchange/triage_model
    volumes:
      - ../models:/exchange:ro          # the model the trainer just exported
    depends_on:
      trainer:
        condition: service_completed_successfully
