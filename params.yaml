# SkinSort model pipeline parameters.
# Every training setting lives here so changing one never means editing code.

seed: 42

data:
  dataset_csv: Data-Pipeline/data/processed/dataset.csv
  images_dir: Data-Pipeline/data/processed/images
  sample_weights: Data-Pipeline/data/processed/sample_weights.csv
  label_column: urgency
  classes: [routine, priority, urgent]     # index 2 = urgent
  splits:
    train: train
    val: val
    test: test
    pad_train: pad_train
    pad_val: pad_val
    pad_test: pad_test
    fairness: fairness_test
  answer_columns: [q_itch, q_grew, q_hurt, q_changed, q_bleed, q_elevation]

train:
  backbones: [resnet50, efficientnet_b3, convnext_tiny]
  image_size: 384
  batch_size: 32
  epochs: 15
  lr: 0.0003
  weight_decay: 0.0001
  class_weights: [1.0, 1.5, 3.0]   # routine, priority, urgent
  early_stopping_patience: 3
  num_workers: 4
  smoke_test_rows: 200             # small run to check the code before using a GPU

augment:
  random_crop_scale: [0.8, 1.0]
  horizontal_flip: true
  vertical_flip: true
  brightness: 0.2
  contrast: 0.2
  blur_prob: 0.2                   # mimics soft phone photos

fusion:
  hidden_dim: 64
  dropout: 0.3
  epochs: 10
  lr: 0.0001

evaluate:
  urgent_recall_target: 0.90       # main test set
  pad_urgent_recall_target: 0.85   # phone photos
  max_calibration_error: 0.05

bias:
  slices: [sex, age_group, body_site, skin_tone, source]
  min_urgent_cases: 20
  max_recall_gap: 0.05

tuning:
  n_trials: 20
  lr: [0.00001, 0.001]
  weight_decay: [0.00001, 0.01]
  dropout: [0.0, 0.5]
  urgent_weight: [2.0, 6.0]

mlflow:
  experiment_name: skinsort-model
  tracking_uri: mlruns
  registered_model_name: skinsort-triage
